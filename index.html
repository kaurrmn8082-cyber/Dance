<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="./style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
</head>
<body>
    
    <nav class="flex items-center justify-evenly px-3 py-3">
        <img src="./images/logo.p.png" alt="">
        <ul class="ul hidden md:flex items-center justify-evenly w-[45%] text-[17px] z-[1]">
            <li>HOME</li>
            <li>ABOUT</li>
            <li>SERVICES</li>
            <li>CLIENT</li>
            <li>CONTACT US</li>
        </ul>
        <i class="hidden md:block ri-user-3-fill text-[22px] cursor-pointer hover:text-[#fa7f63]"></i>
        <i class="hidden md:block ri-search-line text-[22px] cursor-pointer hover:text-[#fa7f63]"></i>
        <button class="hidden md:block ring-1 p-3 text-[18px] text-white bg-[#fa7f63] rounded-[50px] cursor-pointer"><i class="ri-phone-fill mr-2"></i>Call: +1234567890</button>
        <i class="md:hidden ri-menu-line text-[24px] menu"></i>
    </nav>


<!-- SECTION 1 START -->
 <section class="box1 h-auto flex flex-col relative items-center justify-evenly bg-red-00">
    <img src="./images/dance.png" alt="" class="ddance">
    <button class="bg-[#fa7f63] relative p-3 md:w-[13%] rounded-full text-white text-[18px] font-bold hover:bg-black hover:scale-90 mt-9">Read more</button>
    <h1 class="absolute md:text-[140px] text-[60px] z-[-1] font-bold md:mb-0 mb-17">START DANCE</h1>
 </section>
<!-- SECTION 1 END-->


</body>

<script>
        let menu = document.querySelector(".menu")
        let ul = document.querySelector(".ul")

        menu.addEventListener("click",()=>{
            ul.classList.toggle("show")
        })
    </script>

</html>
